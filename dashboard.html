    <script>
        // Vérifie que l'utilisateur est connecté
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function deleteCookie(name) {
            document.cookie = name + '=; Max-Age=0; path=/;';
        }

        const session = getCookie("session");
        if (!session) {
            window.location.href = "login.html";
        }
    </script>

    <!--<script src="js/sessionCheck.js"></script>-->

    <script>

        function viderCache() {
            caches.keys().then(names => {
                return Promise.all(names.map(name => caches.delete(name)));
            }).then(() => {
                location.reload(true);
            });
        }

        document.getElementById("pseudo").innerText = getCookie("session");

        function logout() {
            deleteCookie("session");
            window.location.href = "index.html";
        }

        function loadPage(url, urlJs) {
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    // Remplacer le body ou un conteneur spécifique
                    document.body.innerHTML = html;

                    // Charger le JS externe si fourni
                    if (urlJs) {
                        const fullPath = `./scripts/${urlJs}`;

                        // Vérifier si le script n'est pas déjà chargé
                        if (!document.querySelector(`script[src="${fullPath}"]`)) {
                            const script = document.createElement('script');
                            script.src = fullPath;
                            script.async = false; // exécution après le HTML
                            document.body.appendChild(script);
                        }
                    }

                    // Mettre à jour l'URL sans recharger la page
                    history.pushState({}, '', url);
                })
                .catch(err => console.error('Erreur de chargement de la page :', err));
        }

        function loadPage2(url, urlJs,scoreObj,idTypeJeu) {
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    // Remplacer le body ou un conteneur spécifique
                    document.body.innerHTML = html;

                    window.debutScore = scoreObj;
                    window.type = idTypeJeu;
                    
                    // Charger le JS externe si fourni
                    if (urlJs) {
                        const fullPath = `./scripts/${urlJs}`;

                        // Vérifier si le script n'est pas déjà chargé
                        if (!document.querySelector(`script[src="${fullPath}"]`)) {
                            const script = document.createElement('script');
                            script.src = fullPath;
                            script.async = false; // exécution après le HTML
                            document.body.appendChild(script);
                        }
                    }

                    // Mettre à jour l'URL sans recharger la page
                    history.pushState({}, '', url);
                })
                .catch(err => console.error('Erreur de chargement de la page :', err));
        }

        
    </script>
